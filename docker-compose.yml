name: attus-fullstack-challenge

services:
  db:
    image: mariadb:11.4
    container_name: attus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: attus_challenge
      MARIADB_USER: attus
      MARIADB_PASSWORD: attus
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - attus-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uattus", "-pattus"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
    container_name: attus-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/attus_challenge
      SPRING_DATASOURCE_USERNAME: attus
      SPRING_DATASOURCE_PASSWORD: attus
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: attus-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  attus-mariadb-data:
